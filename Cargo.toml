[package]
name = "act-mcp"
version = "0.1.0"
edition = "2021"
# rmcp 3.9's floor (its own Cargo.toml declares rust-version = "1.88"); do not
# lower it, the 2026-07-28 protocol plumbing in rmcp does not build below it.
rust-version = "1.88"
description = "HTTP MCP server (protocol 2026-07-28) wrapping nektos/act with .evidence JSONL output"
publish = false

[lib]
name = "act_mcp"
path = "src/lib.rs"

[[bin]]
name = "act-mcp"
path = "src/main.rs"

[dependencies]
# Pinned to the 3.9 line on purpose: this server speaks exactly one protocol
# revision (2026-07-28) and rmcp is what implements the negotiation for it.
# Bumping rmcp means re-checking docs/adr/0001 and the conformance suite (mact-f1w.16).
rmcp = { version = "3.9", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "time",
    # sync: run-state handoff (watch/mutex) between the run task and cancel_run (mact-f1w.8/.11).
    # io-util: line-oriented reading of act's stdout/stderr pipes (mact-f1w.8).
    "sync",
    "io-util",
    # fs: the runner's teardown removes the run's secret file with tokio::fs rather than
    # blocking a worker on it (mact-f1w.8, runner::run). Only `cargo build` notices this
    # is needed: `cargo test` got the feature from the dev-dependency's `full` set and
    # never asked for it on the library build.
    "fs",
] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
# CancellationToken: one token drives axum graceful shutdown and MCP session teardown.
tokio-util = "0.7"
# tower-http is used for the request-trace layer; tower is here because rmcp's
# tower services are composed with it directly (mact-f1w.13 adds the Host/Origin
# guards as tower layers).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
anyhow = "1"
thiserror = "2"
which = "8"

# git: plain `git` CLI via tokio::process, NOT git2/libgit2. Decided in
# mact-f1w.5 and recorded here so nobody re-litigates it: act itself shells out
# to git, the gates we need (rev-parse, status --porcelain, worktree add) are all
# CLI subcommands, and libgit2 would add a C build dependency for no gain.
# The CLI is first used in mact-f1w.6 (workspace + commit validator).
#
# Deferred deps, deliberately not listed yet so `cargo build` stays honest about
# what this scaffold actually links; each lands with the ticket that consumes it:
#   chrono        - landed in mact-f1w.8 (run timestamps); the evidence writer (.9) reuses it.
#   uuid          - NOT wanted after all: the ADR-0002 §1.2 run_id shape is
#                   `YYYYMMDDTHHMMSSZ-<6 hex>`, which `runner::RunId::generate` builds from
#                   chrono plus 3 bytes of /dev/urandom. A v7 UUID adds a dependency to
#                   produce 6 hex characters; if a later ticket wants a real UUID, it is
#                   additive inside `RunId`.

# YAML: needed to read `.github/workflows/*.yml` (the `name:` key and the `jobs:`
# map) during workflow/task resolution — mact-f1w.6. Deliberately yaml-rust2 and
# not serde_yaml: serde_yaml is unmaintained (RUSTSEC-2024-0320), and we need only
# "parse and walk", not serde derives on untrusted workflow files. `default-features
# = false` drops encoding_rs; the loader reads &str. mact-f1w.7 (`list_tasks`)
# builds its richer job index on the same crate rather than adding a second parser.
yaml-rust2 = { version = "0.13", default-features = false }

# Timestamps: UTC everywhere (ADR-0002 §2.2). Chosen in the scaffold's Cargo.toml comment
# because rmcp already pulls chrono into the tree; mact-f1w.8 uses it for `started_at` /
# `finished_at` on a run outcome. `clock` is what gives `Utc::now()`; default features are
# off so no serde/time formatting bloat rides along (rmcp's own features keep what it needs).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The `.evidence` contract's machine-readable half is `schema/evidence.schema.json`, and
# `act-mcp validate-evidence` (mact-f1w.9) is the CI guard that checks real trees against
# it. Validating against the *pinned schema file* rather than a hand-written lookalike is
# the whole anti-rot story (ADR-0002 §7), so the engine is a runtime dependency, not a
# dev-dependency. Default features are off so nothing pulls a HTTP client to resolve
# remote `$ref`s: both our schemas are self-contained and embedded with `include_str!`.
# This is also the "second, stricter implementation" ADR-0002's verification table asks
# the schema to compile under.
jsonschema = { version = "0.61", default-features = false }

# The runner (mact-f1w.8) is the only code in this crate that signals a process, and
# signalling a *process group* has no `std` API: `killpg(2)`/`prctl(2)` come from libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Same rmcp, plus the client half so the tests can be a real MCP client (a stock
# client listing tools is the ticket's definition of done).
rmcp = { version = "3.9", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
] }
tempfile = "3"
# Raw JSON-RPC over plain HTTP for the cases a well-behaved client never sends
# (e.g. an initialize naming an older protocol revision).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full", "macros"] }

# libc is a regular (unix) dependency since mact-f1w.8; integration tests keep using it for
# `libc::kill`, which is why the crate attribute is `deny(unsafe_code)` and not `forbid`.

