name: Coverage
on:
  pull_request:
    branches: [main]
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run tests with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Report
        run: cargo llvm-cov report --lcov --output-path lcov.info
