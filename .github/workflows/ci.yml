# CI for act-mcp.
#
# Deliberately thin, and thin on purpose: this repository's convention is that the logic of
# a check lives in a script a human can run, not in YAML nobody can run. Everything here is
# therefore either setup (checkout, cache, pinned toolchain, tool install) or a single call
# into scripts/. If CI is red, `scripts/ci.sh --keep-going …` is red on your laptop, and
# docs/ci.md says which step and why.
#
# Two jobs:
#   check   — the whole suite: fmt, clippy -D warnings, the workspace build, rustdoc, cargo test,
#             the fathom snapshot and headless steps, schema validation, cargo deny and the
#             dependency firewalls. No docker and no act on the runner, and none needed: tests/e2e
#             is the pipeline proof (docs/testing.md §1).
#   release — the release build for every platform this project ships, from the commit `check`
#             approved: cargo deny again (the same gate, beside the binaries it now governs), the
#             workspace release build, then the two artefacts — `act-mcp` and `fathom` — each
#             smoke-tested by its own script and uploaded under its own name.

name: CI

on:
  push:
    branches: [master]
    # A docs-only commit cannot break the crate, and a build that runs anyway teaches
    # people to ignore the badge. The full set of paths that can break it:
    paths:
      # Every crate in the workspace, in one pattern: each crate's manifest, sources and tests
      # live under `crates/` since the split (mact-by1.5, ADR-0005 §3), and a pattern that names
      # the directory rather than the crates cannot forget the next one. The root manifest is
      # listed below; a workspace member's own Cargo.toml is inside `crates/**`.
      - "crates/**"
      - "schema/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    # No path filter here on purpose: a required status check that does not run for some
    # PRs blocks that PR from merging, so PRs always get a run.
  workflow_dispatch:

# One run per branch at a time; a superseded PR push has nothing to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository, and a build that could is a build nobody audited.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # One cache for the whole job: the registry (what cargo downloads) and ./target
      # (what it compiles). Keyed on Cargo.lock plus the toolchain pin, so a lockfile or
      # toolchain change starts cold, and restore-keys let a lockfile bump reuse the rest.
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: target
        run: rustup target add "${{ matrix.target }}"
      # No toolchain action: rustup reads rust-toolchain.toml, which is the pin, and
      # installs the components (clippy, rustfmt) listed in it. `rustup show` is what
      # triggers that resolution, and prints what CI actually built with.
      - name: toolchain
        run: rustup show

      - name: tools
        run: scripts/install_ci_tools.sh

      # The check itself. Everything except the release build, and `--keep-going` so one
      # red step reports the others instead of hiding them.
      - name: ci
        run: scripts/ci.sh --keep-going fmt clippy build doc test tui-snapshot fathom-report fathom-doctor coverage benchmark mcp-driver schema supply-chain

  release:
    name: release build (${{ matrix.target }})
    # Only build a release from a commit that passed the checks.
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    env:
      # ci.sh's release step passes this through to cargo build and to
      # scripts/smoke_binary.sh, which runs the artefact and reports its version+digest.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # rust-toolchain.toml pins the toolchain; the *target* is per matrix entry, so it is
      # added here rather than in the toolchain file (which would force every local dev to
      # carry every platform's std).
      - name: target
        run: rustup target add "${{ matrix.target }}"

      - name: tools
        # cargo-deny only: this job's gate is the supply-chain step, and it runs none of the python
        # second opinions. Pinned version, pinned sha256, same script the check job uses.
        run: scripts/install_ci_tools.sh --deny-only

      # The supply-chain gate again, in the job that builds the artefacts and not only in the job that
      # ran the tests: an artefact is shippable because of the graph it was built from, and this matrix
      # is the only place the musl and macOS triples are ever resolved. `--keep-going` because a
      # deny.toml failure and a release-profile compile failure are two different questions and a
      # build should answer both. `release-workspace` is the release profile over all three crates, so
      # a failure that only appears unoptimised is red before anything is packaged.
      - name: supply-chain gate and workspace release build
        run: scripts/ci.sh --keep-going supply-chain release-workspace

      # Both artefacts here, in one step: CI's job is to say "this commit ships neither", whereas
      # cd.yml — the one that actually publishes — builds, smokes and uploads each in its own step so
      # a fathom that will not link cannot hold up the server (ADR-0005 §3).
      - name: release build and smoke test
        run: scripts/ci.sh release

      # The binaries, their `--version` output and their sha256, exactly as the smoke scripts produced
      # them. (`download-artifact` drops the exec bit; re-chmod after download.) Two names, and one
      # `dist/<binary>/` directory each: the two binaries share one `release/` directory, and one
      # artefact's digest must not quietly overwrite the other's.
      - name: upload act-mcp
        uses: actions/upload-artifact@v4
        with:
          name: act-mcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/act-mcp
            target/${{ matrix.target }}/release/dist/act-mcp/version.txt
            target/${{ matrix.target }}/release/dist/act-mcp/sha256.txt
          if-no-files-found: error

      - name: upload fathom
        uses: actions/upload-artifact@v4
        with:
          name: fathom-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fathom
            target/${{ matrix.target }}/release/dist/fathom/version.txt
            target/${{ matrix.target }}/release/dist/fathom/sha256.txt
          if-no-files-found: error
