name: Integration Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  integration-test-with-workflow:
    name: Run integration tests against MCP
    runs-on: ubuntu-latest
    env:
      # Not a speed measure. act-mcp passes `--bind`, which makes the container's workspace path equal
      # this checkout's (ADR-0003 F8), so the workflow this job asks the runner to run builds *in*
      # ./target and replaces what this job built there. Build where the run cannot reach, and resolve
      # the binary from the same place every time. See `mcp-evidence.yml` and `crates/act-mcp/tests/
      # workflow_guards.rs` R3.
      CARGO_TARGET_DIR: /var/tmp/integration-target
    steps:
      # act sets ACT inside every container it starts, so a non-empty ACT means the runner is already
      # running this job — and this job starts a runner. Refused before the build, not after it.
      - name: Refuse a nested runner
        run: |
          set -euo pipefail
          if [[ -n "${ACT:-}" ]]; then
            echo "::error::this job starts the MCP action runner, and the runner is what is running it (ACT=${ACT})"
            exit 1
          fi
          echo "ACT is unset: starting a runner here is the point of the job"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Act config
        run: |
          mkdir -p ~/.config/act
          cat > ~/.config/act/actrc <<'EOF'
          -P ubuntu-latest=catthehacker/ubuntu:act-latest
          -P ubuntu-24.04=catthehacker/ubuntu:act-latest
          EOF
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash

      - name: Start mcp
        run: |
          set -euo pipefail
          cargo build --release -p act-mcp --bin act-mcp
          # `act` from the install step above, resolved rather than assumed: act-mcp refuses to boot
          # without it, and a boot refusal looks like a port that never opens. There is no ./bin/act in
          # this repository, which is what the `--act-binary $(pwd)/bin/act` this replaced could only
          # ever have been.
          command -v act >&2
          ls -l "$CARGO_TARGET_DIR/release/act-mcp"
          "$CARGO_TARGET_DIR/release/act-mcp" serve --workspace "$PWD" > /tmp/act-mcp.log 2>&1 & # nohup

      - name: Wait for port 8080
        run: |
          # Loop until localhost:8080 returns a 200 OK
          timeout 60s bash -c 'until curl -s localhost:8080; do sleep 1; done'

      - name: Test list tasks
        run: |
          list_tasks=$(npx @modelcontextprotocol/inspector \
            --cli \
            --transport http \
            --protocol-era modern \
            --method tools/call \
            --tool-name list_tasks \
            http://localhost:8080/mcp  2>/dev/null)
          result=$(echo $list_tasks | jq '.structuredContent.workflow_count')
          # Counted against the directory rather than a literal, because what this assertion is for is
          # "the runner sees every workflow file that is here", and a hardcoded number answers a
          # different question: it goes red the day anyone adds a workflow for an unrelated reason, and
          # it goes green the day someone deletes one. `coverage.yml`, `benchmarks.yml` and
          # `mcp-evidence.yml` are the reason this changed from 6, and they will not be the last.
          expected=$(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -type f | wc -l | tr -d ' ')
          if [ "$result" != "$expected" ]; then
            echo "Assertion failed: list_tasks reported $result workflow(s), the directory holds $expected"
            exit 1
          fi

      - name: Test workflow execution
        run: |
          export ACT_CONFIG="$HOME/.config/act/actrc"
          echo $ACT_CONFIG
          set +e
          tool_call=$(npx @modelcontextprotocol/inspector \
            --cli http://localhost:8080/mcp \
            --transport http \
            --protocol-era modern \
            --method tools/call \
            --tool-name run_workflow \
            --tool-arg category=test \
            --tool-arg commit=dccac9683fd690753d345b73638b78502eaedc57 \
            --tool-arg task=check \
            --tool-arg wait=false \
            --tool-arg workflow=.github/workflows/dogfood.yml \
            2>inspector.err)
          status=$?
          echo "inspector exit code: $status"
          echo "stdout: $tool_call"
          echo "stderr:"; cat inspector.err
          workflow_status=$(echo $tool_call | jq -r '.structuredContent.status')
          run_id=$(echo $tool_call | jq -r '.structuredContent.run_id')
          echo "act.jsonl: "
          cat $(pwd)/.evidence/runs/$run_id/act.jsonl
          echo "workflow_status: $workflow_status"
          echo "run_id=$run_id" >> "$GITHUB_ENV"
          if [ "$status" -ne 0 ] || [ "$workflow_status" = "failed" ] || ! echo "$tool_call" | jq -e '(.isError // false) == false' >/dev/null; then
            echo "Assertion failed"
            exit 1
          fi
      - name: Wait for execution
        run: |
          for i in $(seq 1 90); do
            tool_call=$(npx @modelcontextprotocol/inspector \
            --cli http://localhost:8080/mcp \
            --transport http \
            --protocol-era modern \
            --method tools/call \
            --tool-name run_status \
            --tool-arg run_id=$run_id \
            2>/dev/null)
            status=$?
            workflow_status=$(echo "$tool_call" | jq -r '.structuredContent.run.status')
            terminal=$(echo "$tool_call" | jq -r '.structuredContent.run.terminal // false')
            echo "poll $i: status=${workflow_status:-<none>} terminal=$terminal"
            [ "$terminal" = "true" ] && break
            sleep 10
          done
          if [ "$terminal" != "true" ]; then
            echo "Timed out waiting for run to finish"
            echo "$tool_call"; cat inspector.err
            exit 1
          fi

          if [ "$workflow_status" != "success" ]; then   # use your server's actual success value
            echo "Run finished with status: $workflow_status"
            echo "$tool_call"
            exit 1
          fi
      - name: Read logs
        if: always()
        run: |
          echo "Server logs"
          cat /tmp/act-mcp.log
          echo "Run logs"
          cat .evidence/runs/$run_id/act.jsonl
