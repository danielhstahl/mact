on:
  release:
    types: [published]
jobs:
  build_rust_binary:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # release changes require contents write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: target
        run: rustup target add "${{ matrix.target }}"

      - name: update the workspace version
        # One version for one repo (ADR-0005 §8): the tag sets `[workspace.package] version` in the
        # root manifest once and every member inherits it. Logic lives in a script, not in this
        # YAML, so it is runnable and checkable before a tag exists (`scripts/set_version.py
        # --check 0.0.1`), and it refuses a tag that is not a version instead of shipping a tarball
        # named after a typo.
        run: |
          version=${{ github.event.release.tag_name }}
          scripts/set_version.py "${version#v}"

      - name: release build and smoke test
        # scripts/ci.sh's release step builds `-p act-mcp --bin act-mcp` and smoke-tests it: the
        # artefact is one renamed binary, and a broken TUI must not block shipping the server.
        run: scripts/ci.sh release

      - name: Release
        run: |
          cd target/release
          mv act-mcp mact
          tar czvf ../../mact-${{ matrix.target }}.tar.gz mact

      - name: upload artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} mact-${{ matrix.target }}.tar.gz
